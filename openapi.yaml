openapi: 3.0.3

info:
  title: Evently API
  version: 1.0.0
  description: |
    API проекта Evently — MAX Mini App для поиска и персональных
    рекомендаций мероприятий.

    Документ описывает публичные методы, используемые в основном
    пользовательском сценарии и при технической проверке решения.

servers:
  - url: https://thoroughly-advise-nav-jack.trycloudflare.com
    description: Public verification environment

  - url: http://localhost:13000
    description: Local Docker environment

tags:
  - name: System
  - name: Feed
  - name: Categories
  - name: Events
  - name: Profile
  - name: Interactions

paths:

  /health:
    get:
      tags:
        - System
      summary: Проверка состояния API
      operationId: getHealth
      responses:
        '200':
          description: API работает
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - service
                  - timestamp
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: evently-api
                  timestamp:
                    type: string
                    format: date-time

  /api/feed/:
    get:
      tags:
        - Feed
      summary: Получить рекомендательную ленту мероприятий
      operationId: getFeed

      parameters:
        - name: limit
          in: query
          required: false
          description: Максимальное количество мероприятий
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20

        - name: category
          in: query
          required: false
          description: Slug категории
          schema:
            type: string
          example: cinema

        - name: city
          in: query
          required: false
          description: Внутренний код города
          schema:
            type: string
            maxLength: 32
          examples:
            Moscow:
              value: msk
            Novosibirsk:
              value: nsk

        - name: latitude
          in: query
          required: false
          description: Широта пользователя для географического поиска
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90

        - name: longitude
          in: query
          required: false
          description: Долгота пользователя для географического поиска
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180

        - name: x-evently-client-id
          in: header
          required: false
          description: |
            Идентификатор клиента для персонализации и истории
            взаимодействий в web/demo режиме.
          schema:
            type: string

      responses:
        '200':
          description: Лента мероприятий
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedResponse'

        '400':
          description: Некорректные query-параметры

        '500':
          description: Внутренняя ошибка сервера

  /api/categories/:
    get:
      tags:
        - Categories
      summary: Получить категории мероприятий
      operationId: getCategories

      responses:
        '200':
          description: Список доступных категорий
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: '#/components/schemas/Category'
                  - type: object
                    additionalProperties: true

  /api/events/:
    get:
      tags:
        - Events
      summary: Получить список мероприятий
      operationId: getEvents

      responses:
        '200':
          description: Список мероприятий
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /api/events/{id}:
    get:
      tags:
        - Events
      summary: Получить мероприятие по ID
      operationId: getEventById

      parameters:
        - name: id
          in: path
          required: true
          description: UUID мероприятия
          schema:
            type: string
            format: uuid

      responses:
        '200':
          description: Информация о мероприятии
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'

        '404':
          description: Мероприятие не найдено

  /api/profile/interests/:
    get:
      tags:
        - Profile
      summary: Получить интересы пользователя
      operationId: getProfileInterests

      parameters:
        - name: x-evently-client-id
          in: header
          required: false
          description: Идентификатор клиента в web/demo режиме
          schema:
            type: string

      responses:
        '200':
          description: Интересы пользователя
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

    put:
      tags:
        - Profile
      summary: Сохранить интересы пользователя
      operationId: updateProfileInterests

      parameters:
        - name: x-evently-client-id
          in: header
          required: false
          description: Идентификатор клиента в web/demo режиме
          schema:
            type: string

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: |
                Набор выбранных пользователем интересов.
                Формат соответствует frontend-клиенту Evently.

      responses:
        '200':
          description: Интересы сохранены

        '400':
          description: Некорректное тело запроса

  /api/interactions/:
    post:
      tags:
        - Interactions
      summary: Зарегистрировать взаимодействие с мероприятием
      operationId: createInteraction

      parameters:
        - name: x-evently-client-id
          in: header
          required: false
          description: Идентификатор клиента
          schema:
            type: string

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InteractionRequest'

            examples:
              impression:
                summary: Просмотр карточки
                value:
                  eventId: 11111111-1111-4111-8111-111111111111
                  type: IMPRESSION
                  metadata:
                    position: 0
                    feed: for-you

              favorite:
                summary: Добавление в избранное
                value:
                  eventId: 11111111-1111-4111-8111-111111111111
                  type: FAVORITE

      responses:
        '200':
          description: Взаимодействие зарегистрировано
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

        '400':
          description: Некорректные входные данные

components:

  schemas:

    FeedResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Event'
      additionalProperties: true

    Event:
      type: object
      required:
        - id
        - title
      properties:
        id:
          type: string
          format: uuid

        source:
          type: string

        externalId:
          type: string

        sourceCity:
          type: string
          nullable: true
          example: msk

        title:
          type: string

        shortDescription:
          type: string
          nullable: true

        description:
          type: string
          nullable: true

        sourceUrl:
          type: string
          nullable: true

        ticketUrl:
          type: string
          nullable: true

        priceMin:
          type: number
          nullable: true

        priceMax:
          type: number
          nullable: true

        currency:
          type: string
          example: RUB

        isFree:
          type: boolean

        ageRating:
          type: string
          nullable: true

        status:
          type: string
          example: ACTIVE

        popularityScore:
          type: number

        occurrences:
          type: array
          items:
            $ref: '#/components/schemas/EventOccurrence'

        images:
          type: array
          items:
            $ref: '#/components/schemas/EventImage'

        categories:
          type: array
          items:
            type: object
            additionalProperties: true

        venue:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Venue'

      additionalProperties: true

    EventOccurrence:
      type: object
      properties:
        id:
          type: string
          format: uuid

        startsAt:
          type: string
          format: date-time

        endsAt:
          type: string
          format: date-time
          nullable: true

        ticketUrl:
          type: string
          nullable: true

      additionalProperties: true

    EventImage:
      type: object
      properties:
        id:
          type: string
          format: uuid

        url:
          type: string

        position:
          type: integer

      additionalProperties: true

    Venue:
      type: object
      properties:
        id:
          type: string
          format: uuid

        name:
          type: string

        address:
          type: string
          nullable: true

        city:
          type: string
          nullable: true

        latitude:
          type: number
          nullable: true

        longitude:
          type: number
          nullable: true

      additionalProperties: true

    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid

        slug:
          type: string
          example: concert

        name:
          type: string

        icon:
          type: string
          nullable: true

        sortOrder:
          type: integer

        active:
          type: boolean

      additionalProperties: true

    InteractionRequest:
      type: object
      required:
        - eventId
        - type

      properties:
        eventId:
          type: string
          format: uuid

        type:
          type: string
          enum:
            - IMPRESSION
            - OPEN
            - DWELL
            - FAVORITE
            - UNFAVORITE
            - TICKET_CLICK
            - SHARE
            - HIDE

        durationMs:
          type: integer
          minimum: 0
          maximum: 3600000

        metadata:
          type: object
          additionalProperties:
            nullable: true
            oneOf:
              - type: string
              - type: number
              - type: boolean

